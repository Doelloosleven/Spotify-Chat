plugins {
    // Non-remapping Loom for Minecraft 26.x (official Mojang names)
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

// One jar per Minecraft version: spotify-chat-<mod>+<minecraft>.jar
// Build another version with e.g.  gradlew build -Pminecraft_version=26.3 -Pfabric_version=0.162.0+26.3 -Pminecraft_dep=~26.3
version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/releases/'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    // Optional: only for the settings button in Mod Menu
    compileOnly("com.terraformersmc:modmenu:${project.modmenu_version}") { transitive = false }
}

processResources {
    // The mod's own version stays plain (e.g. 1.1.1) so the update checker compares versions cleanly
    inputs.property "version", project.mod_version
    inputs.property "minecraft_dep", project.minecraft_dep
    filesMatching("fabric.mod.json") {
        expand "version": project.mod_version, "minecraft_dep": project.minecraft_dep
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = 'UTF-8'
}
